# Runs the tests on every push and pull request, on Linux, macOS and Windows,
# with pygame-ce (the default) and with classic pygame.
name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  SDL_VIDEODRIVER: dummy          # no real window needed
  SDL_AUDIODRIVER: dummy
  PYGAME_HIDE_SUPPORT_PROMPT: "1"

jobs:
  test:
    name: pygame-ce, Python ${{ matrix.python }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python: ["3.9", "3.10", "3.11", "3.12", "3.13", "3.14"]
        include:
          - { os: macos-latest, python: "3.14" }
          - { os: windows-latest, python: "3.9" }
          - { os: windows-latest, python: "3.14" }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Show which pygame is installed
        run: python -m pip list | grep -i pygame
        shell: bash
      - name: Run tests
        run: python -m pytest

  other-pygames:
    name: ${{ matrix.label }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { label: "Classic pygame 2.6.1", python: "3.12", pygame: "pygame==2.6.1" }
          - { label: "Oldest classic pygame (2.5.2)", python: "3.11", pygame: "pygame==2.5.2" }
          - { label: "Oldest pygame-ce (2.4.1)", python: "3.11", pygame: "pygame-ce==2.4.1" }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - name: Install (without the default pygame-ce)
        run: |
          python -m pip install --no-deps -e .
          python -m pip install "${{ matrix.pygame }}" pytest
          python -m pip list | grep -i pygame
      - name: Run tests
        run: python -m pytest

  package:
    name: Build and check the package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - name: Build
        run: |
          python -m pip install build twine
          python -m build
          python -m twine check --strict dist/*
      - name: Install the wheel in a clean environment and import it
        run: |
          python -m venv /tmp/clean
          /tmp/clean/bin/pip install dist/*.whl
          /tmp/clean/bin/pip list | grep -i pygame
          cd /tmp
          /tmp/clean/bin/python -W error::RuntimeWarning -c "import pathlib, pygame, pygame_essentials as pk; assert pygame.IS_CE, 'expected pygame-ce'; assert (pathlib.Path(pk.__file__).parent / 'py.typed').exists(); print('pygame-essentials', pk.__version__, 'on', pygame.version.ver, 'OK')"
