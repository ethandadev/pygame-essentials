[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "pygame-toolkit"
dynamic = ["version"]  # read from pygame_toolkit.__version__
description = "Handy, well-documented building blocks for pygame games: UI widgets, timers, animation, camera, particles, save data and a debug overlay."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "ethandadev" }]
requires-python = ">=3.9"
dependencies = ["pygame>=2.5"]
keywords = ["pygame", "game", "gamedev", "ui", "widgets", "gui", "camera", "particles", "animation", "spritesheet"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Education",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Games/Entertainment",
    "Topic :: Software Development :: Libraries :: pygame",
    "Typing :: Typed",
]

[project.optional-dependencies]
dev = ["pytest>=8", "build", "twine"]

[project.urls]
Homepage = "https://github.com/ethandadev/pygame-toolkit"
Documentation = "https://github.com/ethandadev/pygame-toolkit#readme"
Changelog = "https://github.com/ethandadev/pygame-toolkit/blob/main/CHANGELOG.md"
Issues = "https://github.com/ethandadev/pygame-toolkit/issues"

[tool.setuptools.dynamic]
version = { attr = "pygame_toolkit.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
pygame_toolkit = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests", "src/pygame_toolkit"]
addopts = "--doctest-modules"
